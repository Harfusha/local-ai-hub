[server]
bind = "127.0.0.1"
client_host = "" # optional client-side override; wildcard binds automatically connect via loopback
port = 11435
ollama_url = "http://127.0.0.1:11434"
auto_start_ollama = false
state_dir = "~/.local-ai-hub/state"
request_timeout_seconds = 900
# Slow/broken clients cannot occupy a handler while dribbling a request body.
request_body_timeout_seconds = 15
# Release idle HTTP/1.1 keep-alive sockets so they do not exhaust handler slots.
keepalive_timeout_seconds = 5
# Bound handler threads independently from the model queue so overload fails fast.
max_concurrent_requests = 64
overload_wait_seconds = 0.05
max_request_body_bytes = 16777216 # 16 MiB for JSON/API requests; bundle upload has its own limit

[security]
# Fail closed if the HTTP hub is exposed beyond loopback. Multi-tenancy is scheduling/fairness, not authentication.
allow_remote = false
api_token = "" # required (>=16 chars) when allow_remote=true and bind is non-loopback

[browser_bridge]
# Capture is explicit: only the extension action click can request the current tab.
enabled = true
# Empty by default: operators must configure the exact extension origin (or
# protect the route with the hub API token). Never use a wildcard origin.
allowed_origins = []
capability_ttl_seconds = 60
max_payload_bytes = 12582912
max_screenshot_bytes = 8388608
max_dom_chars = 2000000
max_context_chars = 1000000
max_elements = 256

[hardware]
# auto detects OS/architecture, RAM and NVIDIA/AMD/Intel/Apple graphics.
# Shared-memory iGPU systems use the conservative integrated profile instead of
# being sized from misleading Windows AdapterRAM values.
# Explicit values: cpu, integrated, low, balanced, high, max. User overrides always win.
profile = "auto"
auto_tune = true

[models]
# Use 0.5B for preprocessing, 1.5B for quick/simple requests, 3B for ordinary and more involved work, and 7B for the hardest reasoning.
# These are the only model choices most users need to edit.
background_code = "qwen2.5-coder:0.5b"
fast_code = "qwen2.5-coder:1.5b"
heavy_code = "qwen2.5-coder:3b"
reasoning = "qwen2.5-coder:7b"
general = "qwen2.5-coder:3b"
vision = "qwen3-vl:4b"
embedding = "BAAI/bge-small-en-v1.5"
embedding_backend = "sentence-transformers"
embedding_device = "cpu"
reranker = "BAAI/bge-reranker-v2-m3"
reranker_backend = "torch"
reranker_device = "cpu"

[vision]
# Local Qwen3-VL is authoritative. Cloud fallback is opt-in and fails closed
# until an explicit provider integration is configured by the operator.
cloud_fallback_enabled = false
cloud_provider = ""

[llama_cpp]
# On Intel-only systems, use the loopback SYCL model router when ready.
# The adapter is optional and never installs or starts a model server.
mode = "auto" # off | auto | on (on is an explicit manual override)
model_load_timeout_seconds = 600
fallback_to_ollama = false

[llama_cpp.models."qwen2.5-coder:1.5b"]
url = "http://127.0.0.1:12438"
served_model = "hub-qwen-15"
context_length = 32768

[llama_cpp.models."qwen2.5-coder:0.5b"]
url = "http://127.0.0.1:12438"
served_model = "hub-qwen-05"
context_length = 16384

[llama_cpp.models."qwen2.5-coder:3b"]
url = "http://127.0.0.1:12438"
served_model = "hub-qwen-3"
context_length = 32768

[llama_cpp.models."qwen2.5-coder:7b"]
url = "http://127.0.0.1:12438"
served_model = "hub-qwen-7"
context_length = 32768

[llama_cpp.models."qwen3-vl:4b"]
url = "http://127.0.0.1:12438"
served_model = "hub-qwen-vl"
context_length = 8192

[openvino]
# Optional Intel NPU/iGPU acceleration for retrieval. The integrated hardware
# profile selects this automatically on Intel shared-memory graphics systems.
# Device order is explicit because OpenVINO AUTO does not select NPU by default.
enabled = true
device_priority = ["NPU", "GPU", "CPU"]
cpu_fallback = true
auto_install = true
cache_dir = "~/.local-ai-hub/state/openvino-cache"


[model_execution.background]
# Dedicated idle-only Ollama process. Hardware profiles adjust parallelism and
# batch sizes before user overrides are applied. It never delays foreground work.
context_tokens = 8192
large_context_tokens = 16384
max_context_tokens = 16384
background_context_tokens = 8192
parallel = 4
max_prompt_tokens = 12000
context_reserve_tokens = 2048
thinking = false

[model_execution.fast]
# Fast/simple tier (1.5B). Hardware profiles reduce context pressure on smaller hosts.
context_tokens = 32768
large_context_tokens = 32768
max_context_tokens = 32768
background_context_tokens = 16384
parallel = 2
max_prompt_tokens = 28000
context_reserve_tokens = 2048
thinking = false

[model_execution.smart]
# Complex 3B and highest-reasoning 7B tiers. Qwen 2.5 Coder supports up to 32k here.
context_tokens = 32768
large_context_tokens = 32768
max_context_tokens = 32768
background_context_tokens = 24576
parallel = 1
max_prompt_tokens = 24000
context_reserve_tokens = 3072
thinking = false
thinking_roles = ["reasoning", "critic", "second-opinion"]

[model_execution.generic]
context_tokens = 32768
large_context_tokens = 32768
max_context_tokens = 32768
background_context_tokens = 16384
parallel = 1
max_prompt_tokens = 24000
context_reserve_tokens = 2048
thinking = false

[model_execution.vision]
# Screenshot review uses a separate conservative single-slot role.
context_tokens = 8192
large_context_tokens = 8192
max_context_tokens = 8192
background_context_tokens = 8192
parallel = 1
max_prompt_tokens = 6000
context_reserve_tokens = 1024
thinking = false

[routing]
heavy_min_score = 3
# Reviews need stronger evidence before spending smart-tier latency.
review_heavy_min_score = 5
max_fast_context_chars = 90000
# Reuse a quality-equivalent resident Qwen instead of swapping fast <-> smart unnecessarily.
prefer_resident_model = true
resident_fast_margin = 0
# Keep the configured reasoning role authoritative. Resident fallback is opt-in.
reasoning_resident_fallback = false

[background_gpu]
# Separate opportunistic Ollama server for semantic preprocessing. This is
# intentionally not the foreground scheduler's server because NUM_PARALLEL is
# process-global in Ollama. The foreground runner is unloaded before lease.
enabled = true
process_priority = "idle"
ollama_url = "http://127.0.0.1:11436"
# Optional serial CPU lane used while the GPU worker is not eligible. It is a
# separate Ollama process, so it cannot alter the foreground GPU profile.
cpu_fallback_enabled = false
cpu_ollama_url = "http://127.0.0.1:11439"
cpu_context_tokens = 32768
idle_seconds = 60.0
parallel = 4
max_queue = 32
keep_alive = "10m"
request_timeout_seconds = 90
flash_attention = true
kv_cache_type = "q8_0"
gpu_overhead_bytes = 268435456
max_cpu_offload_fraction = 0.12
profile_retry_cooldown_seconds = 120.0
file_batch_size = 4
module_batch_size = 4

[scheduler]
# Balanced baseline; the hardware profile overlays this before explicit user values.
max_parallel = 2
max_loaded_models = 1
max_queue = 256
max_queued_per_tenant = 128
max_inflight_per_tenant = 4
affinity_batch_jobs = 0 # 0 = drain current-model queue first
affinity_batch_seconds = 0 # 0 = no time-based switch while current-model jobs remain
max_other_model_wait_seconds = 120 # anti-starvation safety valve; 0 disables it
switch_cooldown_seconds = 1
# A failed model load fails queued callers immediately and briefly opens a circuit breaker.
model_switch_failure_cooldown_seconds = 20
# Absolute ceiling for any scheduler caller, including accidental unbounded waits.
max_caller_wait_timeout_seconds = 1800

[async_jobs]
enabled = true
max_pending = 256
wait_max_seconds = 600
lease_seconds = 3600
result_ttl_seconds = 259200
max_attempts = 3

[work_orchestrator]
# Whole-task delegation: plan -> bounded DAG -> transactional edits -> validation -> final handoff.
enabled = true
max_active_work_orders = 1
max_pending_work_orders = 32
# Work workers are lazy and retire after this idle period; a new submit restarts them.
worker_idle_seconds = 120
max_steps = 32
max_llm_steps = 24
max_replans = 2
max_seconds = 3600
parallel_llm_steps = 1
parallel_deterministic_steps = 2
step_retry_limit = 3
validation_commands = 5
max_patch_files = 64
max_patch_bytes = 2097152
allow_edits = true
allow_create = true
allow_delete = true
rollback_on_failure = true
default_response_profile = "compact"
default_max_output_tokens = 1200

[debug_traces]
enabled = true
terminal_ttl_seconds = 259200
max_bytes = 268435456
max_sessions = 1000
max_events_per_session = 20000
max_event_bytes = 65536
max_session_text_bytes = 8388608
cleanup_batch_size = 50
max_list_limit = 200

[ollama]
enabled = false # explicit opt-in only; setup/service never install, start, or pull Ollama by default
num_parallel = 2
# Auto hardware profiles admit Vulkan only for non-Intel integrated graphics.
# Intel GPU inference uses the optional llama.cpp SYCL route instead.
allow_integrated_gpu = false
enable_vulkan = false
flash_attention = true
kv_cache_type = "q8_0"
gpu_overhead_bytes = 268435456 # reserve 256 MiB so desktop VRAM pressure does not turn into an OOM
keep_alive = "24h" # keep the active model resident until the scheduler intentionally switches it
request_attempts = 1
retry_delay_seconds = 0.6
startup_timeout_seconds = 60

[smart_ollama]
# Disabled by default: no foreground Ollama process is started or assumed.
enabled = false
url = "http://127.0.0.1:11437"
model = ""
num_parallel = 1
context_length = 32768
flash_attention = true
kv_cache_type = "q8_0"
keep_alive = "10m"
startup_timeout_seconds = 30
handoff_timeout_seconds = 10
retry_cooldown_seconds = 120

[ollama_subagents]
# Named local agents remain advisory-only; they use Hub read tooling and never mutate repositories.
enabled = true
default_profile = "qwen-explorer"
language = "match_input"

[ollama_subagents.profiles.qwen-explorer]
model = "qwen2.5-coder:1.5b"
role = "explorer"
max_steps = 8
max_tool_calls = 16
max_tokens = 2048
temperature = 0.05

[ollama_subagents.profiles.qwen-drafter]
model = "qwen2.5-coder:3b"
role = "drafter"
max_steps = 8
max_tool_calls = 16
max_tokens = 4096
temperature = 0.08

[ollama_subagents.profiles.qwen-critic]
model = "qwen2.5-coder:7b"
role = "critic"
max_steps = 8
max_tool_calls = 16
max_tokens = 4096
temperature = 0.03

[token_saving]
# The hub itself reads/searches repositories so broad source context never has to enter the cloud agent.
default_repo_context_tokens = 8000
max_diff_tokens = 24000
max_local_input_tokens = 56000
max_local_output_tokens = 8192
compression_chunk_tokens = 8000
# Legacy fallback rate for telemetry rows without separate input/output counters.
cloud_token_cost_usd_per_million = 3.0
# Cloud model input/output rates used for channel-specific USD savings estimates.
cloud_input_token_cost_usd_per_million = 3.0
cloud_output_token_cost_usd_per_million = 3.0
# Large local responses are stored outside agent context and represented by a compact preview + artifact id.
compact_responses = true
max_inline_chars = 1800
artifact_ttl_hours = 72

[review]
# Synchronous reviews stay bounded; large reviews use durable async delivery.
max_async_chunks = 32
max_queue_age_ms = 30000

[cpu_retrieval]
foreground_priority = 3
# Runs outside the GPU scheduler. These limits bound CPU/RAM contention while the
# foreground model is active; both layers retain their own persistent caches.
embedding_trust_remote_code = true
embedding_max_seq_length = 8192
embedding_batch_size = 16
reranker_batch_size = 4
reranker_max_length = 1024

[cache]
# Two-tier cache. L1 RAM avoids SQLite round-trips; L2 SQLite survives restarts and is shared by all agents.
l1_generation_entries = 2048
l1_generation_ttl_seconds = 3600
l1_repo_entries = 2048
l1_repo_ttl_seconds = 1800
l1_embedding_entries = 16384
l1_embedding_ttl_seconds = 7200
l1_reranker_entries = 8192
l1_reranker_ttl_seconds = 7200
# Exact local generations are shared across agents. Concurrent duplicates become one single-flight request.
generation = true
generation_ttl_seconds = 604800 # 7 days
generation_max_entries = 10000
# Embedding/reranker caches are cross-workspace and persist across restarts.
embeddings = true
embedding_ttl_seconds = 2592000 # 30 days
embedding_max_entries = 100000
reranker = true
reranker_ttl_seconds = 1209600 # 14 days
reranker_max_entries = 100000

[semantic_cache]
# Conservative semantic reuse: only rephrased tasks with an identical context/model/system/options scope may reuse an answer.
enabled = true
threshold = 0.935
ttl_seconds = 604800
max_entries = 10000
max_candidates = 128
min_query_chars = 8
l1_entries = 512
l1_ttl_seconds = 1800

[workspace_cache]
# Repo-state fingerprints invalidate repo/search/context/command caches as soon as workspace content changes.
fingerprint_ttl_seconds = 10.0
fingerprint_l1_entries = 256
# Foreground Git probes are deliberately bounded. Slow Git degrades to a short stale/metadata fingerprint instead of blocking requests.
git_probe_timeout_seconds = 1.0
git_status_timeout_seconds = 2.5
# Same-root single-flight wait is bounded independently from Git subprocess deadlines.
fingerprint_flight_timeout_seconds = 8.0
slow_git_cooldown_seconds = 12.0
max_changed_paths = 512
max_untracked_walk_files = 2048
degraded_fingerprint_max_files = 2048
non_git_max_files = 12000 # recursive metadata fingerprint; correctness-safe cache invalidation outside Git
repo_result_ttl_seconds = 604800
repo_result_max_entries = 20000
rag_search_ttl_seconds = 86400
rag_search_max_entries = 10000

[commands]
# Shared safe CLI broker. Read/validation/build commands are repo-state cached and single-flight across agents.
enabled = true
allow_read = true
allow_validation = true
allow_build = true
allow_mutating = true
allow_unknown = true
# User-whitelisted executable names for custom developer tooling:
extra_allowed_tools = []
timeout_seconds = 1800
# Duplicate agents wait only this long for an identical owner; the owner continues
# and the waiter receives an in-progress response instead of hanging for the full build.
coalesced_wait_seconds = 180

[speculative_lint]
# Opt-in only. Runs read-only lint after a quiet period against caller-supplied changed paths.
enabled = false
debounce_seconds = 1.0
max_paths = 64
timeout_seconds = 120
terminate_grace_seconds = 2
post_kill_drain_seconds = 2
success_ttl_seconds = 43200
failure_ttl_seconds = 180
max_entries = 5000
max_failure_entries = 1000
l1_entries = 128
l1_ttl_seconds = 900
max_output_chars = 2000000
inline_output_chars = 5000
environment_keys = ["CI", "NODE_ENV", "APP_ENV", "PYTHONPATH"]

[prewarm]
# Warm the cheap default coder once the hub starts. Scheduler still owns all later model switches.
enabled = true
startup_model = "fast_code"
delay_seconds = 1.5
# Allow managed backends to finish startup before abandoning prewarm.
backend_wait_seconds = 30.0

[search]
special_filenames = ["Dockerfile", "Containerfile", "docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml", "Makefile", "GNUmakefile", "justfile", "Gemfile", "Pipfile", ".env", ".env.example", ".env.sample", ".gitlab-ci.yml", ".gitlab-ci.yaml", "azure-pipelines.yml", "azure-pipelines.yaml"]
prefer_git_files = true
# Optional deterministic accelerator; absence of rg falls back to Python scanning.
use_ripgrep_if_available = true
use_git_grep_fallback = true # fast tracked-file search when rg is unavailable
ripgrep_timeout_seconds = 8.0
# Keep foreground Git helpers strictly bounded; slow repositories fall back to cached/Python paths.
git_grep_timeout_seconds = 4.0
git_files_timeout_seconds = 3.0
git_files_cache_ttl_seconds = 3.0
git_files_slow_cooldown_seconds = 15.0
max_snippets_per_file = 3
semantic_fraction = 0.35
max_files = 8000
max_hits = 80
snippet_lines = 5
context_top_k = 14

[observability]
# Raw per-request/per-inference events are short-lived; compact daily rollups survive longer.
max_events = 100000
raw_retention_days = 30
rollup_retention_days = 365
batch_size = 64
flush_interval_seconds = 0.5
queue_size = 10000
snapshot_interval_seconds = 60
# Avoid self-observation noise from cheap health/status/report polling.
exclude_http_paths = ["/health", "/dashboard", "/favicon.ico", "/api/status", "/api/live", "/api/live/status", "/api/metrics", "/api/telemetry/report", "/api/audit/tail", "/api/control"]

[logging]
# Operational rotating logs. Do not log prompts/source/model output.
level = "INFO"
max_bytes = 5000000
backup_count = 5
queue_size = 5000

[tools]
serena_package = "serena-agent==1.7.0"
codegraph_package = "codegraphcontext[gcf]==0.6.8"

[code_intelligence]
# Serena and CodeGraphContext are managed behind the hub so agents see one compact MCP surface.
enabled = true
serena_enabled = true
codegraph_enabled = true
preprocess_serena = true
preprocess_codegraph = true
# Set explicit executable paths only when auto-discovery is insufficient.
serena_command = ""
codegraph_command = ""
serena_context = "ide-assistant"
codegraph_output_format = "gcf"
# Skip oversized tracked exports during CodeGraph indexing; source files remain indexed.
codegraph_max_file_size_mb = 5
startup_timeout_seconds = 45
query_timeout_seconds = 20
index_timeout_seconds = 1200
max_output_chars = 9000
failure_threshold = 2
cooldown_seconds = 60
max_sessions_per_backend = 8
session_idle_ttl_seconds = 900
# Optional escape hatch: expose Serena/CodeGraph directly to cloud agents as extra MCP servers.
# Default false saves tool-schema tokens and routes usage through Local AI Hub.
direct_agent_mcp = false

[bundles]
# Portable project-index snapshots. Import validates format, row counts and archive size.
max_bundle_bytes = 134217728 # 128 MiB compressed upload
max_json_bytes = 268435456 # 256 MiB uncompressed bundle.json
max_rows_per_table = 1000000

[features]
# Master feature switches. Disabling a feature removes it from MCP registration,
# dynamic agent skills, instructions, and generated schemas.
status = true # health, queue, cache, telemetry inspection (local_ai_status)
repo = true # primary repository worker (local_ai_repo)
tasks = true # local model inference worker (local_ai_task)
vision = true # image understanding/frontend review and qwen3-vl model
rag = true # semantic retrieval fallback (local_ai_rag)
commands = true # safe command execution broker (local_ai_command)
coord = true # coordination leases, memos, task contracts (local_ai_coord)
artifacts = true # compact responses & evidence slicing (local_ai_artifact)
code_intelligence = true # Serena / CodeGraphContext backends
preprocessing = true # background idle project warmup
subagents = true # advisory local profiles (qwen-explorer, etc.)
agent_os = true # durable execution: tasks, verification receipts, memory
dashboard = true # realtime web dashboard at /dashboard
work_orchestrator = true # whole-task DAG execution and verified handoff (local_ai_work)
enriched_search = true # source-enriched repository search
batch_replacement = true # atomic repository batch replacement
diagnostic_artifacts = true # persist command diagnostic artifacts
local_diagnostic_dispatch = true # bounded L1 local failure diagnosis
reranker = true
install_local_nlp_dependencies = true
install_openvino_dependencies = true
pull_models_during_setup = true

[rag]
scope = "shared" # shared across agent processes; set to "tenant" for retrieval isolation
chunk_chars = 4500
chunk_overlap_chars = 450
embedding_batch_size = 12
rerank_candidates = 16
max_file_bytes = 2000000
extensions = [
  ".txt", ".md", ".rst", ".py", ".php", ".js", ".jsx", ".ts", ".tsx",
  ".java", ".cs", ".go", ".rs", ".cpp", ".c", ".h", ".hpp", ".rb",
  ".kt", ".kts", ".swift", ".scala", ".sh", ".ps1", ".yaml", ".yml", ".toml",
  ".json", ".xml", ".html", ".css", ".sql", ".tf", ".tfvars", ".proto",
  ".ini", ".cfg", ".properties", ".gradle"
]
ignore_dirs = [
  ".git", ".svn", ".hg", ".idea", ".vscode", ".venv", "venv", "node_modules",
  "vendor", "dist", "build", "bin", "obj", "coverage", ".next", ".cache",
  ".serena", ".codegraphcontext", ".local-ai-hub", "tool-envs", "site-packages", "__pycache__",
  ".pytest_cache", ".mypy_cache", ".ruff_cache", ".tox", ".nox", ".eggs", "htmlcov",
  "target", "out", ".terraform", ".turbo", ".parcel-cache",
  "Library", "Temp", "Logs", "UserSettings"
]


[mcp]
# One compact public MCP surface; Serena/CodeGraph stay behind it by default.
compact_max_text_chars = 6000
compact_max_evidence = 16

[mcp.response_budget]
# Aggregate agent-facing budgets are enforced after semantic projection. Exact
# source/log detail remains available through local_ai_artifact.
enabled = true
default_tokens = 3200
max_tokens = 8192
reuse_cache_size = 256
ledger_size = 512
tool_tokens = { local_ai_status = 500, local_ai_task = 1000, local_ai_repo = 1200, local_ai_rag = 900, local_ai_command = 700, local_ai_coord = 800, local_ai_artifact = 900, local_ai_work = 800 }
# MCP calls are intentionally bounded. Preprocessing is asynchronous, so no normal
# foreground tool should need an unbounded multi-hour socket wait.
quick_timeout_seconds = 180
context_timeout_seconds = 600
model_timeout_seconds = 1800
long_timeout_seconds = 2400
host_tool_timeout_seconds = 2400

[workflow]
direct_repo_context_tokens = 3000
# Deterministic policy hints used by the compact task/repo tools.
fast_repo_context_tokens = 8000
heavy_repo_context_tokens = 16000
impact_max_symbols = 48
impact_max_dependents = 30
root_family_token_budget = 250000
root_family_max_active_scopes = 1

[agents]
agent_skills_standard = true
codex = true
claude = true
gemini = true
# Major MCP-native desktop/IDE agents. Setup preserves unrelated user configuration.
cursor = true
windsurf = true
copilot = true
# Additional MCP hosts can be wired explicitly without changing setup.py.
# mcpServers-style JSON (Claude/Cursor/Gemini container):
extra_mcp_json_paths = []
# VS Code/Copilot `servers`-style JSON:
extra_vscode_mcp_paths = []

[setup]
install_dir = "~/.local-ai-hub"
backup_existing_configs = true
install_agent_configs = true
install_service = true
install_optional_tools = true

# ---------------- local-first orchestration ----------------
[lossless_router]
# Inspired by token-router: the local model chooses coordinates; the cloud receives
# exact original lines, never a locally rewritten version of the evidence.
enabled = true
threshold_tokens = 1400
max_ranges = 8
context_lines = 4
selector_output_tokens = 450
# Skip the selector model when lexical/error/symbol scoring is already decisive.
deterministic_skip_score = 4.5
deterministic_skip_min_terms = 1
max_scan_lines = 12000
max_selector_chars = 100000
max_output_lines = 140
ttl_seconds = 604800
max_entries = 10000
l1_entries = 256
l1_ttl_seconds = 1800

[local_pipeline]
# fast = explorer only; adaptive = worker/critic only when justified; quality = all stages.
enabled = true
default_mode = "adaptive"
worker_min_complexity_score = 2
critic_min_risk_score = 4
explorer_skip_worker_confidence = 0.84
direct_smart_enabled = true
direct_smart_complexity_score = 4
direct_smart_risk_score = 4
explorer_max_tokens = 2048
worker_max_tokens = 4096
critic_max_tokens = 4096
canonical_max_chars = 6000
# Foreground execution uses one fast-tier pass, then escalates to the smart tier only when justified.
same_model_worker_passes = 1
second_pass_min_complexity_score = 2
ttl_seconds = 604800
max_entries = 12000
l1_entries = 256
l1_ttl_seconds = 1800

[resilience]
watchdog_enabled = true
watchdog_interval_seconds = 5
journal_stale_seconds = 900
circuit_failure_threshold = 3
circuit_cooldown_seconds = 20
scheduler_wait_timeout_seconds = 900
singleflight_wait_timeout_seconds = 300
model_fallback_enabled = true
max_model_fallbacks = 1
serve_stale_on_error = true
stale_generation_ttl_seconds = 2592000
stale_generation_max_entries = 10000

# Agent-specific projections happen after canonical local work, so they do not
# fragment the expensive Ollama cache.
[agent_output.codex]
max_text = 3000
max_evidence = 7
raw_evidence = 1
risks = "critical"
relationships = false
commands = true

[agent_output.claude]
max_text = 4500
max_evidence = 10
raw_evidence = 3
risks = "all"
relationships = true
commands = true

[agent_output.gemini]
max_text = 3500
max_evidence = 9
raw_evidence = 3
risks = "important"
relationships = true
commands = true

[agent_output.cursor]
max_text = 3200
max_evidence = 8
raw_evidence = 2
risks = "important"
relationships = true
commands = true

[agent_output.windsurf]
