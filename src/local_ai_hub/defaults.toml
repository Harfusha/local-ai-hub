commands = true

[snapshot_cache]
# Reuses decoded/hash file snapshots across different lexical queries in one hub process.
max_entries = 4096
max_bytes = 268435456
# Bound coalesced waiters so a dead owner never stalls every agent indefinitely.
# This is intentionally longer than normal model inference but still finite.
# Can be overridden under [resilience].

# ---------------- Idle project preprocessing ----------------
[preprocessing]
# Opportunistic whole-project warmup. Every expensive unit is a low-priority,
# checkpointed micro-job and yields as soon as foreground work appears.
enabled = true
cpu_priority = "idle"
idle_grace_seconds = 0.0
model_switch_idle_seconds = 60.0
cpu_runs_during_foreground = false
poll_seconds = 0.75
# Watch registrations are reconciled independently from project scan cadence.
watcher_refresh_seconds = 3.0
auto_recheck_seconds = 1800
# Background work is globally pausable; only this many projects preprocess simultaneously.
max_preprocessing_projects = 3
cpu_workers = 4
touch_debounce_seconds = 15
sqlite_busy_timeout_seconds = 0.5
sqlite_write_retries = 6
lookup_l1_ttl_seconds = 30
reject_temp_projects = true
require_project_markers = false
ignore_internal_install = true
major_change_ratio = 0.15
major_change_files = 60
major_change_ratio_min_files = 12
hash_files_per_step = 256
rag_files_per_step = 16
# Skip embeddings for declarative files fully represented by deterministic parsers.
skip_rag_for_deterministic_declarative = true
compact_lexical_for_deterministic_declarative = true
deterministic_lexical_max_chars = 12000
db_maintenance_interval_seconds = 1800
orphan_cleanup_roots_per_run = 4
lexical_files_per_step = 128
code_index_files_per_step = 256
deterministic_files_per_step = 256
# Most simple/source/test/config cards are built from parsers instead of Ollama.
prefer_deterministic_cards = true
# Aggregate deterministic file cards into module/project cards before considering Ollama enrichment.
prefer_deterministic_modules = true
deterministic_module_confidence = 0.84
prefer_deterministic_project = true
deterministic_project_confidence = 0.84
deterministic_hot_query_confidence = 0.94
learned_hot_queries = 12
file_card_max_bytes = 180000
file_card_max_lines = 900
file_card_max_chars = 18000
file_card_output_tokens = 320
module_max_files = 80
module_output_tokens = 420
project_output_tokens = 650
preprocess_symbol_sample = 300
hot_query_top_k = 8
hot_context_tokens = 1800
lookup_file_cards = 5
lookup_candidate_cards = 120
background_request_timeout_seconds = 300
background_scheduler_timeout_seconds = 75
max_error_backoff_seconds = 300
hot_queries = [
  "architecture entry points main components dependencies",
  "tests build lint static analysis validation commands",
  "configuration startup environment dependency injection",
  "API routes controllers handlers public interfaces",
  "database persistence models repositories migrations data flow",
  "authentication authorization security permissions secrets",
  "errors exceptions retry recovery resilience logging",
  "concurrency queues workers background jobs scheduling locking"
]

[local_tools]
# Read-only tools exposed to Ollama explorer/worker loops. Calls reuse the same
# project snapshots, RAG, reranker and preprocessing caches as cloud-facing MCP.
enabled = true
max_steps = 3
max_tool_calls = 6
bootstrap_deterministic_tools = true
auto_register_project = false
max_tool_result_chars = 4800
preprocessed_context_chars = 2800
semantic_bypass_confidence = 0.94 # local tools cannot waste RAG when exact deterministic facts suffice
direct_synthesis_confidence = 0.90 # high-confidence warm evidence skips tool-schema round trips

# ---------------- Adaptive execution / deterministic intelligence ----------------
[code_index]
enabled = true
# Built-in Python AST + conservative generic symbol/call/import extractor. No external parser is required.
max_query_results = 30
# Content-addressed parser cache is shared across paths/worktrees.
parse_blob_max_entries = 100000

[evidence]
# Immutable exact source slices are addressed by compact IDs and fetched lazily.
max_entries = 100000

[execution_planner]
enabled = true
direct_confidence = 0.93
worker_below_confidence = 0.78
critic_below_confidence = 0.68
critic_risk_score = 4
graph_weight = 0.65
evidence_weight_per_item = 0.045
max_evidence_confidence = 0.35

[learning]
# Stores only short task/query metadata, never source contents or conversations.
enabled = true
max_queries_per_project = 64
max_query_chars = 240
learned_hot_queries = 12

[autotune]
enabled = true
ema_alpha = 0.20
min_samples = 2
resident_latency_ratio = 1.15

# ---------------- Deterministic-first execution ----------------
[deterministic]
# Use scripts/parsers/caches before embeddings or any local LLM whenever possible.
enabled = true
direct_confidence = 0.94
max_query_results = 30
max_evidence = 12
max_manifest_bytes = 4000000
# Deterministic resolver results are revision-aware. A source/manifest update bumps the project generation.
query_cache_l1_entries = 512
query_cache_l1_ttl_seconds = 300
query_cache_l2_ttl_seconds = 86400
query_cache_l2_max_entries_per_root = 4000
# Reuse deterministic AST/regex/manifest extraction across moved/copied files and worktrees.
fact_blob_max_entries = 100000
manifest_blob_max_entries = 20000
compression = true
compression_confidence = 0.88
# When parser/index facts reach this confidence, skip semantic retrieval and seed local models directly.
context_confidence = 0.80
context_max_chars = 12000
context_raw_evidence = 10

[client]
# MCP/CLI cold-start budgets. Stale startup locks are discarded immediately when their PID is gone.
health_timeout_seconds = 0.75
startup_wait_seconds = 15.0
startup_poll_seconds = 0.15
start_lock_stale_seconds = 20.0
# Hard client-side ceiling even if an MCP wrapper accidentally requests a larger wait.
max_request_timeout_seconds = 1800.0

[headless]
enabled = true
install_service = true
manage_ollama = false
health_check_interval_seconds = 2.0
health_probe_timeout_seconds = 2.0
unhealthy_grace_seconds = 15.0
startup_grace_seconds = 180.0
restart_backoff_initial_seconds = 1.0
restart_backoff_max_seconds = 30.0
rapid_crash_window_seconds = 60
rapid_crash_limit = 8
rapid_crash_cooldown_seconds = 60
max_sessions_per_backend = 8
session_idle_ttl_seconds = 900
# A manual stop writes a disabled marker. MCP clients must not resurrect the service until start/install removes it.
respect_disabled_marker = true
stop_managed_ollama_on_stop = true

[monitoring]
dashboard_enabled = true
live_event_buffer = 2500
live_max_batch = 200

[tool_policy]
install_global_instructions = true

[diagnostics]
max_fast_cpu_offload_fraction = 0.08
max_smart_cpu_offload_fraction = 0.20
warn_if_external_ollama_profile_unknown = true

[normalization]
enabled = true
strip_boundary_punctuation = true
normalize_unicode = true
normalize_paths = true
split_code_identifiers = true
custom_stop_words = []

[postprocessing]
enabled = true
extract_thinking_tags = true
strip_conversational_preamble = true
repair_markdown_fences = true
normalize_diffs = true

[agent_state]
enabled = true
event_retention_days = 30
max_payload_bytes = 65536
snapshot_interval_events = 50
cleanup_batch_size = 100

[context.preloads]
# Empty by default: repositories opt into bounded files, patterns, and memory kinds.
files = []
patterns = []
memory_kinds = []
max_files = 8
max_bytes = 16000
max_memory = 8

[agent_output]
ultra_compact = true
strip_empty = true
coalesce_snippets = true
prune_stacktraces = true
trim_diff_context = true
flat_symbols = true
