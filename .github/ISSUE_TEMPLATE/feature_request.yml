name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? What use case are you missing?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried a workaround? Are there other approaches?

  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints check
      options:
        - label: The feature keeps the 7-tool MCP surface compact
        - label: All new waits/calls are bounded (no indefinite blocks)
        - label: Optional external tooling (Serena/CodeGraph) can be absent without breaking this feature
