name: Native SimHash experiment

on:
  push:
    paths:
      - "experiments/cython_simhash_votes.pyx"
      - "tools/cython_experiment.py"
      - ".github/workflows/native-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-parity:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Record existing compiler and SDK
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'native-cython'
          New-Item -ItemType Directory -Path $directory | Out-Null
          $discovery = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json
          if (-not $discovery -or -not ($discovery | Where-Object { $_.isComplete -and $_.isLaunchable })) { throw 'No complete existing C++ build host' }
          $discovery | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $directory 'compiler.json')
          Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}/Windows Kits/10/Include" | Select-Object Name | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $directory 'sdk.json')
      - name: Install isolated experiment Python dependencies
        run: python -m pip install -e ".[dev]" "Cython>=3,<4" "setuptools>=75"
      - name: Build and measure in three fresh processes
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'native-cython'
          1..3 | ForEach-Object {
            $output = Join-Path $directory "result-$_.json"
            python tools/cython_experiment.py --iterations 30 --hash-count 256 --work-dir (Join-Path $directory "build-$_") --output $output
            if ($LASTEXITCODE -ne 0) { throw "Native build/parity failed; actual record retained: $output" }
            $result = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
            if ($result.success -ne $true) { throw 'Experiment record failed' }
            $summary = @{process=$_; parity=$result.parity; provenance=$result.provenance; samples=$result.current_production_adapter_samples.Count; whole_workflow_measured=$result.whole_workflow_measured; kernel_gate_met=$result.kernel_gate_met; workflow_gate_met=$result.workflow_gate_met; overall_adoption_recommended=$result.overall_adoption_recommended; production_enabled=$result.production_enabled} | ConvertTo-Json -Depth 8 -Compress
            Write-Output "::notice title=Native experiment evidence::$summary"
          }
          git diff --exit-code
          $untracked = @(git ls-files --others --exclude-standard)
          $ignored = @(git ls-files --others --ignored --exclude-standard)
          if (($untracked + $ignored) | Select-String -Pattern '\.(c|obj|pyd|so)$') { throw 'Native build escaped into checkout' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cython-build-parity-windows-${{ github.sha }}
          path: ${{ runner.temp }}/native-cython
          if-no-files-found: error

  linux-build-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Record existing compiler
        run: |
          mkdir -p "$RUNNER_TEMP/native-cython"
          gcc --version > "$RUNNER_TEMP/native-cython/compiler.txt"
      - name: Install isolated experiment Python dependencies
        run: python -m pip install -e ".[dev]" "Cython>=3,<4" "setuptools>=75"
      - name: Build and measure in three fresh processes
        run: |
          DIRECTORY="$RUNNER_TEMP/native-cython"
          for i in 1 2 3; do
            OUTPUT="$DIRECTORY/result-$i.json"
            python tools/cython_experiment.py --iterations 30 --hash-count 256 --work-dir "$DIRECTORY/build-$i" --output "$OUTPUT"
            if [ $? -ne 0 ]; then
              echo "Native build/parity failed; actual record retained: $OUTPUT"
              exit 1
            fi
            python -c "import json; res = json.load(open('$OUTPUT')); assert res.get('success') is True, 'Experiment record failed'"
          done
          git diff --exit-code
          UNTRACKED=$(git ls-files --others --exclude-standard)
          IGNORED=$(git ls-files --others --ignored --exclude-standard)
          if echo "$UNTRACKED $IGNORED" | grep -E '\.(c|o|pyd|so)$'; then
            echo "Native build escaped into checkout"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cython-build-parity-linux-${{ github.sha }}
          path: ${{ runner.temp }}/native-cython
          if-no-files-found: error

  macos-build-parity:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Record existing compiler
        run: |
          mkdir -p "$RUNNER_TEMP/native-cython"
          clang --version > "$RUNNER_TEMP/native-cython/compiler.txt"
      - name: Install isolated experiment Python dependencies
        run: python -m pip install -e ".[dev]" "Cython>=3,<4" "setuptools>=75"
      - name: Build and measure in three fresh processes
        run: |
          DIRECTORY="$RUNNER_TEMP/native-cython"
          for i in 1 2 3; do
            OUTPUT="$DIRECTORY/result-$i.json"
            python tools/cython_experiment.py --iterations 30 --hash-count 256 --work-dir "$DIRECTORY/build-$i" --output "$OUTPUT"
            if [ $? -ne 0 ]; then
              echo "Native build/parity failed; actual record retained: $OUTPUT"
              exit 1
            fi
            python -c "import json; res = json.load(open('$OUTPUT')); assert res.get('success') is True, 'Experiment record failed'"
          done
          git diff --exit-code
          UNTRACKED=$(git ls-files --others --exclude-standard)
          IGNORED=$(git ls-files --others --ignored --exclude-standard)
          if echo "$UNTRACKED $IGNORED" | grep -E '\.(c|o|pyd|so)$'; then
            echo "Native build escaped into checkout"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cython-build-parity-macos-${{ github.sha }}
          path: ${{ runner.temp }}/native-cython
          if-no-files-found: error
