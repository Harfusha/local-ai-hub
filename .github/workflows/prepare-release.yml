name: Prepare stable release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      draft_release:
        description: Build an isolated verification release without publishing it
        type: boolean
        default: false

concurrency:
  group: prepare-stable-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/master' || (inputs.draft_release && github.ref_type == 'branch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Create versioned release commit and tag
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          DRAFT_RELEASE: ${{ inputs.draft_release }}
        run: |
          set -euo pipefail
          tag=$(python tools/prepare_release.py "$BUMP")
          git add -- pyproject.toml src/local_ai_hub/__init__.py RELEASE.json README.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore(release): $tag"
          python tools/release_check.py --strict-tree --expected-version "${tag#v}"
          if [[ "$DRAFT_RELEASE" == true ]]; then
            tag="$tag-qa.$GITHUB_RUN_ID"
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Dispatch CI on the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DRAFT_RELEASE: ${{ inputs.draft_release }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" -f "draft_release=$DRAFT_RELEASE"
