name: Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify tag and clean release checkout
        shell: bash
        run: python tools/release_check.py --strict-tree --expected-version "${GITHUB_REF_NAME#v}"

      - name: Install build tooling
        run: |
          python -m pip install --require-hashes -r tools/release-build-requirements.txt
          python -m pip check

      - name: Reject tracked mutations
        run: git diff --exit-code

      - name: Recheck strict release tree
        shell: bash
        run: python tools/release_check.py --strict-tree --expected-version "${GITHUB_REF_NAME#v}"

      - name: Build wheel and sdist
        run: python -m build --no-isolation

      - name: Smoke installed wheel MCP health
        timeout-minutes: 2
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/local-ai-hub-wheel-smoke"
          "$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -m pip install --require-hashes --upgrade -r "$GITHUB_WORKSPACE/tools/release-pip-requirements.txt"
          "$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -m pip install -c "$GITHUB_WORKSPACE/tools/release-runtime-constraints.txt" --report "$RUNNER_TEMP/wheel-resolution.json" "$GITHUB_WORKSPACE"/dist/local_ai_hub-*.whl
          "$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -m pip check
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          ACTUAL_VERSION=$("$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/local-ai-hub" --version)
          test "$ACTUAL_VERSION" = "Local AI Hub $EXPECTED_VERSION"
          "$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -I "$GITHUB_WORKSPACE/tools/wheel_smoke.py" > "$RUNNER_TEMP/wheel-mcp-smoke.json"

      - name: Capture resolved inventory and current advisory evidence
        timeout-minutes: 2
        shell: bash
        run: |
          "$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -I tools/release_inventory.py --output dist/dependency-inventory.json --resolver-report "$RUNNER_TEMP/wheel-resolution.json" --lock dist/runtime-requirements.txt --queries "$RUNNER_TEMP/osv-queries.json" --sbom dist/sbom.cdx.json --constraints tools/release-runtime-constraints.txt
          curl --silent --show-error --fail --max-time 30 --max-filesize 8388608 --header "Content-Type: application/json" --data-binary "@$RUNNER_TEMP/osv-queries.json" https://api.osv.dev/v1/querybatch --output "$RUNNER_TEMP/osv-response.json"
          "$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -I tools/release_inventory.py --inventory dist/dependency-inventory.json --response "$RUNNER_TEMP/osv-response.json" --assessment-output dist/current-advisories.json

      - name: Bind smoke receipt to release wheel bytes and commit
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          wheels = list(Path("dist").glob("local_ai_hub-*.whl"))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one built Local AI Hub wheel")
          with wheels[0].open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          receipt_path = Path(os.environ["RUNNER_TEMP"]) / "wheel-mcp-smoke.json"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if receipt.get("success") is not True or receipt.get("smoke") != "passed":
              raise SystemExit("installed wheel MCP smoke did not pass")
          if receipt.get("wheel_sha256") != digest:
              raise SystemExit("installed wheel provenance differs from the built wheel bytes")
          receipt["repository_revision"] = os.environ["GITHUB_SHA"]
          receipt["wheel_file"] = wheels[0].name
          Path("dist/wheel-mcp-smoke.json").write_text(
              json.dumps(receipt, sort_keys=True) + "\n", encoding="utf-8",
          )
          PY

      - name: Create SHA-256 manifest
        shell: bash
        run: |
          cd dist
          sha256sum *.whl *.tar.gz *.json runtime-requirements.txt > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
