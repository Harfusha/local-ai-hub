name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify tag and clean release checkout
        shell: bash
        run: python tools/release_check.py --expected-version "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build

      - name: Run tests
        run: |
          python -m compileall -q src tools
          python -m pytest -q
          python tools/selftest.py
          python tools/check_dashboard.py

      - name: Reject tracked mutations
        run: git diff --exit-code

      - name: Reject runtime side effects before cleanup
        run: python tools/release_check.py --post-test

      - name: Remove expected ignored test/install caches
        run: git clean -fdX

      - name: Recheck release tree
        shell: bash
        run: python tools/release_check.py --expected-version "${GITHUB_REF_NAME#v}"

      - name: Build wheel and sdist
        run: python -m build

      - name: Smoke installed wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/local-ai-hub-wheel-smoke"
          "$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -m pip install --no-deps dist/local_ai_hub-*.whl
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          "$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -c "import local_ai_hub; assert local_ai_hub.__version__ == '$EXPECTED_VERSION'; print(local_ai_hub.__version__)"

      - name: Create SHA-256 manifest
        shell: bash
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
