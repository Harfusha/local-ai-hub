name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tools/release_check.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tools tests
      - run: pyflakes src tools
      - run: pytest
      - run: python tools/selftest.py
      - name: Reject test/runtime side effects
        run: python tools/release_check.py --post-test
      - run: python tools/hubctl.py generate
      - run: python tools/check_dashboard.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python tools/release_check.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python tools/selftest.py
      - run: python tools/check_dashboard.py
      - name: Reject tracked mutations
        run: git diff --exit-code
      - name: Reject runtime side effects before cleanup
        run: python tools/release_check.py --post-test
      - name: Remove expected ignored test/install caches
        run: git clean -fdX
      - name: Recheck clean package tree
        run: python tools/release_check.py
      - run: python -m pip wheel . --no-deps --no-build-isolation -w dist
      - run: python -c "import setuptools.build_meta as b; print(b.build_sdist('dist'))"
      - run: python -m venv "$RUNNER_TEMP/local-ai-hub-wheel-smoke"
      - run: "$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -m pip install --no-deps dist/local_ai_hub-*.whl
      - name: Smoke installed wheel version
        run: |
          EXPECTED_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          "$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -c "import local_ai_hub; assert local_ai_hub.__version__ == '$EXPECTED_VERSION'; print(local_ai_hub.__version__)"
