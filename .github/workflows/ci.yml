name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src mcp tools tests
      - run: pyflakes src tools
      - run: pytest
      - run: python tools/selftest.py
      - run: python tools/hubctl.py generate
      - run: python tools/check_dashboard.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python tools/selftest.py
      - run: python tools/check_dashboard.py
      - run: python -m pip wheel . --no-deps --no-build-isolation -w dist
      - run: python -c "import setuptools.build_meta as b; print(b.build_sdist('dist'))"
      - run: python -m venv wheel-smoke
      - run: wheel-smoke/bin/python -m pip install --no-deps dist/local_ai_hub-*.whl
      - run: wheel-smoke/bin/python -c "import local_ai_hub; print(local_ai_hub.__version__)"
