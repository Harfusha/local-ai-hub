name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 2"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run the full suite in every supported OS/Python combination
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      RUN_FULL_SUITE: ${{ inputs.full_matrix || (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14') || ((github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) && matrix.os == 'windows-latest' && (matrix.python-version == '3.11' || matrix.python-version == '3.14')) }}
      COVERAGE_FILE: ${{ github.workspace }}/.coverage-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python tools/release_check.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tools tests
      - run: pyflakes src tools
      - name: Probe Linux command process cleanup
        if: ${{ env.RUN_FULL_SUITE == 'true' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          import tempfile
          from pathlib import Path
          from local_ai_hub.commands import CommandBroker

          with tempfile.TemporaryDirectory(prefix="local-ai-ci-probe-") as directory:
              broker = CommandBroker({"server": {"state_dir": str(Path(directory) / "state")}})
              result = broker._execute(f'"{sys.executable}" -c "print(123)"', cwd=directory, timeout=10)
              print(json.dumps({"kind": "command_process_cleanup_probe", "result": result}, default=str, sort_keys=True), flush=True)
              if result.get("success") is not True:
                  raise SystemExit(1)
          PY
      - name: Run primary full suite
        if: ${{ env.RUN_FULL_SUITE == 'true' }}
        run: python -m coverage run -m pytest -ra
      - name: Run platform and interpreter compatibility cohort
        if: ${{ env.RUN_FULL_SUITE != 'true' }}
        run: >-
          python -m coverage run -m pytest -q -ra
          tests/test_process_utils.py
          tests/test_process_utils_timeout_cleanup.py
          tests/test_process_group_identity_guard.py
          tests/test_supervisor_windows_launcher.py
          tests/test_canonical_root.py
          tests/test_client_startup_resilience.py
          tests/test_client_startup_transport_fallback.py
          tests/test_sqlite_resilience.py
          tests/test_wheel_module_startup.py
          tests/test_worktree_discovery.py
          tests/test_project_config_worktrees.py
          tests/test_mcp_contract_dispatch.py
          tests/test_automation_broker.py
          tests/test_automation_adapters.py
          tests/test_automation_integration.py
          tests/test_work_fencing.py
          tests/test_t10_treesitter_parser_thread_safety.py
          tests/unit/test_treesitter_native_parser.py
          tests/unit/test_treesitter_isolated_worker.py
          tests/unit/test_owned_biome_daemon.py
          tests/test_agent_context_identity.py
          tests/test_context_identity.py
          tests/unit/test_agent_identity_edge_cases.py
          tests/unit/test_single_owner_state_converter.py
          tests/unit/test_source_slice_mcp_contract.py
          tests/unit/test_supervisor_child_interpreter.py
          tests/unit/test_rollback_exchange_identity.py
          tests/test_command_rollback.py::test_rollback_snapshot_and_restore_accept_nested_paths
          tests/test_command_rollback.py::test_command_rollback_preserves_filesystem_security_metadata
      - name: Export measured branch coverage
        if: always()
        run: python -m coverage json -o "${{ runner.temp }}/coverage.json"
      - name: Retain per-platform coverage baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ env.RUN_FULL_SUITE == 'true' && 'full' || 'compatibility' }}-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/coverage.json
          if-no-files-found: warn
      - run: python tools/selftest.py
      - name: Reject test/runtime side effects
        run: python tools/release_check.py --post-test
      - run: python tools/hubctl.py generate
      - run: python tools/check_dashboard.py

  critical-coverage:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      COVERAGE_FILE: ${{ github.workspace }}/.coverage-critical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - name: Run fixed critical regression cohort
        run: >-
          python -m coverage run -m pytest -q
          tests/test_audit_remediation.py
          tests/test_audit_protocol_remediation.py
          tests/test_audit_transport_remediation.py
          tests/test_audit_dashboard_remediation.py
          tests/test_audit_reliability_remediation.py
          tests/test_audit_context_delivery_remediation.py
          tests/test_audit_action_guide_remediation.py
          tests/test_audit_pending_source_regressions.py
          tests/test_audit_quality_gates.py
          tests/test_audit_release_inventory.py
          tests/test_audit_owned_model_process.py
          tests/test_audit_review_consistency.py
          tests/test_audit_ollama_error_deadline.py
          tests/test_audit_validation_shards.py
          tests/test_audit_release_security.py
          tests/test_audit_cli_status_inventory.py
          tests/unit/test_wheel_smoke_contract.py
          tests/test_async_job_reliability_contract.py
          tests/test_agent_policy.py
          tests/test_agent_identity.py
          tests/test_agent_memory.py
          tests/test_project_command_broker.py
          tests/test_http_admin_action_auth_t18.py
          tests/test_audit_context_transport_contract.py
          tests/test_audit_context_artifact_failure.py
          tests/test_audit_async_finalization_contract.py
          tests/test_audit_budget_process_isolation.py
          tests/test_audit_budget_diagnostics.py
          tests/test_agent_task_budget_increase.py
          tests/test_automation_broker.py
          tests/test_automation_adapters.py
          tests/test_automation_integration.py
          tests/unit/test_capability_grant_validity.py
          tests/unit/test_capability_grant_canonical_inputs.py
          tests/test_audit_critical_coverage_contract.py
          tests/test_audit_review_delivery_quality.py
          tests/test_audit_retrieval_gold_contract.py
          tests/test_audit_quality_eval_contract.py
          tests/unit/test_rollback_exchange_identity.py
      - run: python -m coverage json -o "${{ runner.temp }}/critical-coverage.json"
      - name: Reject per-module branch coverage regression
        run: python tools/check_critical_coverage.py "${{ runner.temp }}/critical-coverage.json" --baseline tools/critical-coverage-win32-py3.13.json
      - name: Check fresh source-symbol and citation goldset
        run: python tools/audit_quality_eval.py --root "${{ github.workspace }}" --output "${{ runner.temp }}/audit-quality.json"
      - name: Check source intent and registered entrypoint regressions
        run: python -m pytest -q tests/test_audit_code_index_entrypoints.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-coverage-windows-py3.13
          path: ${{ runner.temp }}/critical-coverage.json
          if-no-files-found: error

  package:
    needs: [test, critical-coverage]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python tools/release_check.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python tools/selftest.py
      - run: python tools/check_dashboard.py
      - name: Reject tracked mutations
        run: git diff --exit-code
      - name: Reject runtime side effects before cleanup
        run: python tools/release_check.py --post-test
      - name: Remove expected ignored test/install caches
        run: git clean -fdX
      - name: Recheck clean package tree
        run: python tools/release_check.py
      - run: python -m pip wheel . --no-deps --no-build-isolation -w dist
      - run: python -c "import setuptools.build_meta as b; print(b.build_sdist('dist'))"
      - run: python -m venv "$RUNNER_TEMP/local-ai-hub-wheel-smoke"
      - run: '"$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -m pip install dist/local_ai_hub-*.whl'
      - run: '"$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -m pip check'
      - run: '"$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -I -c "import mcp, watchdog"'
      - name: Smoke installed wheel version
        run: |
          EXPECTED_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          "$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -I -c "import local_ai_hub,sys; assert local_ai_hub.__version__ == sys.argv[1]; print(local_ai_hub.__version__)" "$EXPECTED_VERSION"
      - name: Smoke installed CLI outside source checkout
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -I -m local_ai_hub --help'
      - name: Smoke real MCP health from installed wheel
        timeout-minutes: 2
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -I "$GITHUB_WORKSPACE/tools/wheel_smoke.py" > "$RUNNER_TEMP/wheel-mcp-smoke.json"'
      - name: Bind smoke receipt to actual wheel bytes and commit
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          wheels = list(Path("dist").glob("local_ai_hub-*.whl"))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one built Local AI Hub wheel")
          with wheels[0].open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          receipt_path = Path(os.environ["RUNNER_TEMP"]) / "wheel-mcp-smoke.json"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if receipt.get("success") is not True or receipt.get("smoke") != "passed":
              raise SystemExit("installed wheel MCP smoke did not pass")
          if receipt.get("wheel_sha256") != digest:
              raise SystemExit("installed wheel provenance differs from the built wheel bytes")
          receipt["repository_revision"] = os.environ["GITHUB_SHA"]
          receipt["wheel_file"] = wheels[0].name
          receipt_path.write_text(json.dumps(receipt, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Retain installed-wheel MCP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-mcp-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/wheel-mcp-smoke.json
          if-no-files-found: warn

  release:
    name: Publish verified release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [test, package]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
