name: CI

# Feature branches with an open PR run once per update through pull_request.
# Keep independent master and tagged-release pushes fully verified.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 2 * * 2"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run the full suite in every supported OS/Python combination
        type: boolean
        default: false

permissions:
  contents: read

# New commits supersede stale PR runs; never cancel master, tag, scheduled,
# or explicitly dispatched verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NO_TEST_CACHE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python tools/release_check.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c tools/ci-constraints-py3.13.txt
      - run: python -m compileall -q src tools tests
      - run: pyflakes src tools

  typing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c tools/ci-constraints-py${{ matrix.python-version }}.txt
      - run: python -m mypy

  fast-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c tools/ci-constraints-py3.13.txt
      - run: >-
          python -m pytest -q
          tests/test_mcp_contract_dispatch.py
          tests/test_structural_search_php_contract.py
          tests/test_http_route_operation_acceptance.py::test_http_structural_search_rejects_stale_inventory_revision
          tests/test_rag_incremental_index_io.py
          tests/unit/test_evidence_merge.py
          tests/test_http_post_route_registry_t18.py
          tests/test_http_admin_action_auth_t18.py
          tests/test_http_debug_trace_toggle.py
          tests/test_async_job_http_status_mapping.py
          tests/test_audit_acceptance_truth.py
          tests/test_http_scoped_tasks.py
          tests/test_companion_skill_installation.py
          tests/test_ci_event_policy.py
          tests/test_operation_contracts.py::test_memory_mutations_accept_absolute_windows_paths_without_accepting_drive_relative
          tests/test_release_contract.py::test_no_personal_paths_or_runtime_payloads_in_tracked_release_sources
      # Keep actual historical regression scenarios close to the changed code.
      - run: >-
          python -m pytest -q
          tests/test_review_diff_path_scope.py::test_diff_facts_treats_header_like_hunk_lines_as_content
          tests/test_review_diff_path_scope.py::test_malformed_hunk_still_starts_a_new_file_when_real_header_has_hunk
          tests/test_plan_reconcile_steering.py::test_recovery_retries_after_projection_record_write_failure
          tests/test_plan_reconcile_steering.py::test_retry_finishes_pending_record_after_binding_was_already_saved
          tests/test_embedding_gpu_lease_heartbeat.py::test_embedding_renews_gpu_fence_until_long_inference_finishes
          tests/test_token_economy_tools.py::test_response_budget_and_fallback_contracts_match_all_agent_instructions
          tests/test_token_economy_tools.py::test_token_economizer_skill_md
          tests/test_token_efficiency.py::test_trace_context_exposes_optional_metadata_without_changing_base_fields
          tests/unit/test_mcp_gpu_reservation_release_contract.py
          tests/unit/test_hub_006_bounded_workers_admission.py::test_priority_and_starvation_aging_contract
          tests/test_t10_acceptance.py::test_adaptive_retrieval_skips_optional_backends_when_deadline_is_exhausted
          tests/unit/test_search_mode_fusion.py::test_hybrid_fallback_uses_expansion_and_entry_points_for_code_index_queries
      # Catch pinned Windows CUDA asset discovery regressions early on Linux.
      - run: >-
          python -m pytest -q tests/test_llama_cpp_runtime.py
          -k "custom_managed_model_requires_matching_existing_file
          or custom_model_refuses_symlink or explicit_cuda_provision
          or cuda_provision_omits_cpu_variants or managed_server_discovery"

  platform-smoke:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      RUN_FULL_SUITE: ${{ inputs.full_matrix || (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14') || ((github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) && matrix.os == 'windows-latest' && (matrix.python-version == '3.11' || matrix.python-version == '3.14')) }}
      COVERAGE_FILE: ${{ github.workspace }}/.coverage-ci
    steps:
      - uses: actions/checkout@v7
      - name: Verify submodule metadata in a clean checkout
        run: git submodule status
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: python tools/release_check.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Probe Linux command process cleanup
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          import tempfile
          from pathlib import Path
          from local_ai_hub.commands import CommandBroker

          with tempfile.TemporaryDirectory(prefix="local-ai-ci-probe-") as directory:
              broker = CommandBroker({"server": {"state_dir": str(Path(directory) / "state")}})
              result = broker._execute(f'"{sys.executable}" -c "print(123)"', cwd=directory, timeout=10)
              print(json.dumps({"kind": "command_process_cleanup_probe", "result": result}, default=str, sort_keys=True), flush=True)
              if result.get("success") is not True:
                  raise SystemExit(1)
          PY
      - name: Run platform and interpreter compatibility cohort
        if: ${{ env.RUN_FULL_SUITE != 'true' }}
        run: >-
          python -m coverage run -m pytest -q -ra -p tools.ci_diagnostics
          --junitxml=${{ runner.temp }}/platform-smoke-junit.xml
          tests/test_process_utils.py
          tests/test_process_utils_timeout_cleanup.py
          tests/test_process_group_identity_guard.py
          tests/test_supervisor_windows_launcher.py
          tests/test_canonical_root.py
          tests/test_repo_plan_posix_races.py
          tests/unit/test_plan_storage_hardening.py
          tests/test_client_startup_resilience.py
          tests/test_client_startup_transport_fallback.py
          tests/test_sqlite_resilience.py
          tests/test_wheel_module_startup.py
          tests/test_worktree_discovery.py
          tests/test_project_config_worktrees.py
          tests/test_mcp_contract_dispatch.py
          tests/test_automation_broker.py
          tests/test_automation_adapters.py
          tests/test_automation_integration.py
          tests/test_work_fencing.py
          tests/test_t10_treesitter_parser_thread_safety.py
          tests/unit/test_treesitter_native_parser.py
          tests/unit/test_treesitter_isolated_worker.py
          tests/unit/test_owned_biome_daemon.py
          tests/test_agent_context_identity.py
          tests/test_context_identity.py
          tests/unit/test_agent_identity_edge_cases.py
          tests/unit/test_single_owner_state_converter.py
          tests/unit/test_source_slice_mcp_contract.py
          tests/unit/test_supervisor_child_interpreter.py
          tests/unit/test_rollback_exchange_identity.py
          tests/unit/test_rollback_quarantine_identity.py
          tests/unit/test_quality_floor_threshold_validation.py
          tests/unit/test_selftest_canonical_temp_root.py
          tests/unit/test_selftest_conditional_annotations.py
          tests/unit/test_ci_failure_diagnostics.py
          tests/unit/test_prompt_contracts_hardening_wave18.py
          tests/test_gitlink_fixtures.py
          tests/test_scheduler_status_external_reservation.py
          tests/test_command_rollback.py::test_rollback_snapshot_and_restore_accept_nested_paths
          tests/test_command_rollback.py::test_command_rollback_preserves_filesystem_security_metadata
      - name: Preserve per-platform test outcomes
        if: ${{ always() && env.RUN_FULL_SUITE != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-platform-smoke-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/platform-smoke-junit.xml
          if-no-files-found: warn
      - name: Export measured branch coverage
        if: ${{ always() && env.RUN_FULL_SUITE != 'true' }}
        run: python -m coverage json -o "${{ runner.temp }}/coverage.json"
      - name: Retain per-platform coverage baseline
        if: ${{ always() && env.RUN_FULL_SUITE != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-compatibility-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/coverage.json
          if-no-files-found: warn
      - name: Run selftest with bounded CI failure annotations
        env:
          LOCAL_AI_SELFTEST_STARTUP_TIMEOUT: "60.0"
        run: python -m tools.ci_diagnostics --selftest
      - name: Reject test/runtime side effects
        run: python tools/release_check.py --post-test
      - run: python -m local_ai_hub.generator --config src/local_ai_hub/defaults.toml --output-dir .
      - run: python tools/check_dashboard.py
      - name: Reject tracked test mutations
        run: git diff --exit-code
      - name: Clean ignored test artifacts
        if: always()
        run: git clean -fdX

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      RUN_FULL_SUITE: ${{ inputs.full_matrix || (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14') || ((github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) && matrix.os == 'windows-latest' && (matrix.python-version == '3.11' || matrix.python-version == '3.14')) }}
      COVERAGE_FILE: ${{ github.workspace }}/.coverage-integration
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.RUN_FULL_SUITE == 'true' }}
      - uses: actions/setup-python@v7
        if: ${{ env.RUN_FULL_SUITE == 'true' }}
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        if: ${{ env.RUN_FULL_SUITE == 'true' }}
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify source tree
        if: ${{ env.RUN_FULL_SUITE == 'true' }}
        run: python tools/release_check.py
      - name: Install test dependencies
        if: ${{ env.RUN_FULL_SUITE == 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run full integration suite
        if: ${{ env.RUN_FULL_SUITE == 'true' }}
        run: python -m coverage run -m pytest -ra -p tools.ci_diagnostics --junitxml=${{ runner.temp }}/integration-junit.xml
      - name: Preserve full-integration test outcomes
        if: ${{ always() && env.RUN_FULL_SUITE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-integration-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/integration-junit.xml
          if-no-files-found: warn
      - name: Export integration coverage
        if: ${{ always() && env.RUN_FULL_SUITE == 'true' }}
        run: python -m coverage json -o "${{ runner.temp }}/integration-coverage.json"
      - uses: actions/upload-artifact@v7
        if: ${{ always() && env.RUN_FULL_SUITE == 'true' }}
        with:
          name: integration-coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/integration-coverage.json
          if-no-files-found: warn

  critical-coverage:
    needs: [lint, typing, fast-contract]
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      COVERAGE_FILE: ${{ github.workspace }}/.coverage-critical
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: python -m pip install -e ".[dev]"
      - name: Run fixed critical regression cohort
        run: >-
          python -m coverage run -m pytest -q
          --junitxml=${{ runner.temp }}/critical-junit.xml
          tests/test_audit_remediation.py
          tests/test_audit_protocol_remediation.py
          tests/test_audit_transport_remediation.py
          tests/test_audit_dashboard_remediation.py
          tests/test_audit_reliability_remediation.py
          tests/test_audit_context_delivery_remediation.py
          tests/test_audit_action_guide_remediation.py
          tests/test_audit_pending_source_regressions.py
          tests/test_audit_quality_gates.py
          tests/test_audit_release_inventory.py
          tests/test_async_jobs.py::test_success_finalization_checks_artifact_outside_async_job_write_lock
          tests/test_async_jobs.py::test_success_finalization_uses_bounded_write_transaction
          tests/test_async_jobs.py::test_failed_task_callback_runs_outside_async_job_write_lock
          tests/test_async_jobs.py::test_terminal_task_callbacks_run_outside_async_job_write_lock
          tests/test_audit_owned_model_process.py
          tests/test_audit_review_consistency.py
          tests/test_audit_ollama_error_deadline.py
          tests/test_audit_validation_shards.py
          tests/test_audit_release_security.py
          tests/test_audit_cli_status_inventory.py
          tests/unit/test_wheel_smoke_contract.py
          tests/test_async_job_reliability_contract.py
          tests/test_agent_policy.py
          tests/test_agent_identity.py
          tests/test_agent_memory.py
          tests/test_agent_memory_candidate_scope_recall.py
          tests/test_code_index_transaction_boundaries.py
          tests/test_file_locks.py
          tests/test_project_command_broker.py
          tests/test_http_admin_action_auth_t18.py
          tests/test_http_post_route_registry_t18.py
          tests/test_debug_traces.py
          tests/test_http_debug_trace_toggle.py
          tests/test_async_job_http_status_mapping.py
          tests/test_http_context_pack_guard.py
          tests/test_laya_mcp_contract.py
          tests/test_command_remediation.py
          tests/test_audit_context_transport_contract.py
          tests/test_audit_context_artifact_failure.py
          tests/test_audit_async_finalization_contract.py
          tests/test_audit_budget_process_isolation.py
          tests/test_audit_budget_diagnostics.py
          tests/test_agent_task_budget_increase.py
          tests/unit/test_agent_task_receipt_transaction.py
          tests/test_repo_plan_verified_flow.py
          tests/test_automation_broker.py
          tests/test_automation_adapters.py
          tests/test_automation_integration.py
          tests/unit/test_capability_grant_validity.py
          tests/unit/test_capability_grant_canonical_inputs.py
          tests/test_audit_critical_coverage_contract.py
          tests/test_command_rollback.py
          tests/test_command_run_project_fingerprints.py
          tests/test_command_output_artifact_availability.py
          tests/test_command_terse_output.py
          tests/test_command_policy.py
          tests/test_audit_review_delivery_quality.py
          tests/test_audit_retrieval_gold_contract.py
          tests/test_audit_quality_eval_contract.py
          tests/test_scheduler_status_external_reservation.py
          tests/unit/test_rollback_exchange_identity.py
          tests/unit/test_rollback_quarantine_identity.py
          tests/unit/test_quality_floor_threshold_validation.py
          tests/unit/test_prompt_contracts_hardening_wave18.py
      - name: Preserve critical test outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-critical-coverage-windows-py3.13
          path: ${{ runner.temp }}/critical-junit.xml
          if-no-files-found: warn
      - run: python -m coverage json -o "${{ runner.temp }}/critical-coverage.json"
      - name: Reject per-module branch coverage regression
        run: python tools/check_critical_coverage.py "${{ runner.temp }}/critical-coverage.json" --baseline tools/critical-coverage-win32-py3.13.json
      - name: Check fresh source-symbol and citation goldset
        run: python tools/audit_quality_eval.py --root "${{ github.workspace }}" --output "${{ runner.temp }}/audit-quality.json"
      - name: Check source intent and registered entrypoint regressions
        run: python -m pytest -q tests/test_audit_code_index_entrypoints.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: critical-coverage-windows-py3.13
          path: ${{ runner.temp }}/critical-coverage.json
          if-no-files-found: error

  package:
    needs: [lint, typing, fast-contract, platform-smoke, integration, critical-coverage]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: python tools/release_check.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python tools/selftest.py
        env:
          LOCAL_AI_SELFTEST_STARTUP_TIMEOUT: "60.0"
      - run: python tools/check_dashboard.py
      - name: Reject tracked mutations
        run: git diff --exit-code
      - name: Reject runtime side effects before cleanup
        run: python tools/release_check.py --post-test
      - name: Remove expected ignored test/install caches
        run: git clean -fdX
      - name: Recheck clean package tree
        run: python tools/release_check.py
      - run: python -m pip wheel . --no-deps --no-build-isolation -w dist
      - run: python -c "import setuptools.build_meta as b; print(b.build_sdist('dist'))"
      - run: python -m venv "$RUNNER_TEMP/local-ai-hub-wheel-smoke"
      - run: '"$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -m pip install dist/local_ai_hub-*.whl'
      - run: '"$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -m pip check'
      - run: '"$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -I -c "import mcp, watchdog"'
      - name: Smoke installed wheel version
        run: |
          EXPECTED_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          "$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -I -c "import local_ai_hub,sys; assert local_ai_hub.__version__ == sys.argv[1]; print(local_ai_hub.__version__)" "$EXPECTED_VERSION"
      - name: Smoke installed CLI outside source checkout
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -I -m local_ai_hub --help'
      - name: Smoke real MCP health from installed wheel
        timeout-minutes: 2
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/local-ai-hub-wheel-smoke/bin/python" -I "$GITHUB_WORKSPACE/tools/wheel_smoke.py" > "$RUNNER_TEMP/wheel-mcp-smoke.json"'
      - name: Bind smoke receipt to actual wheel bytes and commit
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          wheels = list(Path("dist").glob("local_ai_hub-*.whl"))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one built Local AI Hub wheel")
          with wheels[0].open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          receipt_path = Path(os.environ["RUNNER_TEMP"]) / "wheel-mcp-smoke.json"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if receipt.get("success") is not True or receipt.get("smoke") != "passed":
              raise SystemExit("installed wheel MCP smoke did not pass")
          if receipt.get("wheel_sha256") != digest:
              raise SystemExit("installed wheel provenance differs from the built wheel bytes")
          receipt["repository_revision"] = os.environ["GITHUB_SHA"]
          receipt["wheel_file"] = wheels[0].name
          receipt_path.write_text(json.dumps(receipt, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Retain installed-wheel MCP evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wheel-mcp-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/wheel-mcp-smoke.json
          if-no-files-found: warn

  release:
    name: Publish verified release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [package]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
