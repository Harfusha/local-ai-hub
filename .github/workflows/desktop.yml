name: Native desktop

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'tools/desktop.py'
      - 'tests/test_desktop_control.py'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/target/release/local-ai-hub-desktop
            desktop/target/release/local-ai-hub-desktop.exe
            desktop/Cargo.lock
          if-no-files-found: error
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q tools/desktop.py tests/test_desktop_control.py
      - run: python -m pytest tests/test_desktop_control.py -q
