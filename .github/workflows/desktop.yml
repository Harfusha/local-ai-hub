name: Native desktop

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'tools/desktop.py'
      - 'tests/test_desktop_control.py'
      - 'tests/test_dashboard_operational_surfaces.py'
      - 'src/local_ai_hub/http_*.py'
      - 'tools/hubctl.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev xvfb x11-utils
      - run: cargo test
      - run: cargo build --release
      - name: Linux native window and idle measurement (isolated Xvfb)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install psutil
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 python3 ../tools/desktop_smoke.py target/release/local-ai-hub-desktop > desktop-smoke.json
          cat desktop-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/target/release/local-ai-hub-desktop
            desktop/target/release/local-ai-hub-desktop.exe
            desktop/Cargo.lock
            desktop/desktop-smoke.json
          if-no-files-found: error
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q tools/desktop.py tests/test_desktop_control.py
      - run: python -m pytest tests/test_desktop_control.py tests/test_dashboard_operational_surfaces.py::test_retired_dashboard_route_returns_json_not_found tests/test_packaging_assets.py tests/test_dashboard_updates.py tests/test_audit_dashboard_setting_types.py -q
