interface:
  display_name: "Local AI Orchestrator"
  short_description: "Local-first cached evidence routing, validation and review"
  default_prompt: "Use $local-ai-orchestrator. For each non-trivial repo task, fire-and-forget preprocess once for the stable absolute root, then apply the mandatory cheapest-first hub gate before broad reads/searches. Route repeatable validation through local_ai_command, reuse fresh evidence/artifacts/caches, coordinate overlapping edits, and never poll preprocessing or retry with force/refresh. Native broad exploration is fallback-only after one bounded hub retry."
policy:
  allow_implicit_invocation: true
