[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-hub"
version = "8.2.0"
description = "Deterministic-first local tooling and inference hub for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Local AI Hub contributors"}]
dependencies = [
  "mcp>=1.28,<2",
  "watchdog>=4,<7",
  "PyJWT[crypto]>=2.15.1,<3",
  "jsonschema>=4.18,<5",
  "huggingface-hub>=0.30,<3",
  "pyzipper>=0.4,<1",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
native = ["Cython>=3,<4"]
ast-index = ["tree-sitter-language-pack==1.18.0"]
local-nlp = ["sentence-transformers>=5.4,<6", "transformers>=4.57.4,<4.58"]
laya-runtime = ["laya==0.4.31", "vegaml==0.16.1"]
intel-accelerators = ["sentence-transformers[openvino]>=5.4,<6", "optimum-intel[openvino]>=2.2,<3", "openvino>=2026.1,<2027", "transformers>=4.57.4,<4.58"]
token-economy = ["tiktoken>=0.7", "files-to-prompt>=0.4", "grep-ast>=0.3"]
performance = ["orjson>=3.10,<4", "msgspec>=0.18,<1", "Cython>=3,<4"]
profiling = ["py-spy>=0.3,<1", "scalene>=1.5,<2"]
dev = ["pytest>=8,<10", "pyflakes>=3.2,<4", "ruff>=0.9,<1", "coverage[toml]>=7,<8", "psutil>=7,<8", "numpy>=2,<3", "setuptools>=77.0.3", "wheel>=0.45,<1", "mypy>=1.15,<2", "packaging>=24,<27"]

[project.scripts]
local-ai-hub = "local_ai_hub.__main__:main"
laya-dataset-merge = "local_ai_hub.laya_dataset_merge:main"
tokcount = "local_ai_hub.token_economy:tokcount_main"
trim-run = "local_ai_hub.token_economy:trim_run_main"
repo-map = "local_ai_hub.token_economy:repo_map_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_ai_hub = [
  "defaults.toml",
  "automation_browser.js",
  "grammars/*.gbnf",
  "ui_static/*",
  "ui_static/dist/*",
  "data/*.json",
]
"local_ai_hub.repo_plan" = ["repo-plan.v1.schema.json"]

[tool.setuptools.data-files]
"browser_bridge" = [
  "browser_bridge/background.js",
  "browser_bridge/capture.js",
  "browser_bridge/manifest.json",
  "browser_bridge/offscreen.html",
  "browser_bridge/offscreen.js",
  "browser_bridge/popup.html",
  "browser_bridge/popup.js",
  "browser_bridge/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"
markers = [
  "slow: marks tests as slow or resource-intensive (deselect with -m not slow)",
  "fast: marks lightweight unit tests without heavy I/O or subprocesses",
  "critical: marks critical security, auth, command broker, and memory contract tests",
  "integration: marks tests as integration tests",
  "unit: marks isolated unit tests",
  "acceptance: marks end-to-end acceptance tests",
  "rag: marks RAG, embedding, docset, vector retrieval, and search tests",
  "preprocess: marks polyglot preprocessing, tree-sitter parser, AST outline, and code indexing tests",
  "models: marks AI model lifecycle, Ollama, VRAM, accelerators, token routing, and prompt tests",
  "training: marks fine-tuning, dataset merging/curation, laya runtime, and benchmark tests",
  "mcp: marks Model Context Protocol server, tools, and schema contract tests",
  "http: marks HTTP API routes, server, auth, transport, and SSE stream tests",
  "agent: marks Agent OS, tasks, memory, blackboard, leases, and coordination tests",
  "repo: marks repository tools, git worktrees, AST diff, and patch tests",
  "automation: marks browser automation, browser bridge, async jobs, and scheduler tests",
  "security: marks security, audit, auth, redaction, and permission tests",
  "artifacts: marks artifact storage, paging, slicing, and compaction tests",
  "storage: marks SQLite persistence, transactions, and file lock tests",
  "token_economy: marks token accounting, budget enforcement, repo-map, and trim-run tests",
  "process: marks process management, supervisor, launcher, and signal tests",
]
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
  "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["local_ai_hub"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "8.2.0"
mypy_path = "src"
strict = true
warn_unused_configs = true
files = [
  "src/local_ai_hub/source_outline.py",
  "src/local_ai_hub/mcp_lifecycle_contracts.py",
  "src/local_ai_hub/command_redaction.py",
  "src/local_ai_hub/evidence_merge.py",
  "src/local_ai_hub/http_event_cursor.py",
  "src/local_ai_hub/external_candidate_paths.py",
  "src/local_ai_hub/agent_event_pages.py",
  "src/local_ai_hub/command_patch_paths.py",
  "src/local_ai_hub/mcp_normalization.py",
  "src/local_ai_hub/python_shell_injection.py",
  "src/local_ai_hub/search_fusion.py",
  "src/local_ai_hub/repository_scope.py",
  "src/local_ai_hub/dashboard_contracts.py",
  "src/local_ai_hub/operation_contracts.py",
  "src/local_ai_hub/http_scoped_tasks.py",
  "src/local_ai_hub/telemetry_contracts.py",
  "src/local_ai_hub/agent_identity.py",
  "src/local_ai_hub/compact.py",
  "src/local_ai_hub/monotonic_deadline.py",
  "src/local_ai_hub/native_kernels.py",
  "src/local_ai_hub/runtime_assets.py",
  "src/local_ai_hub/source_facts.py",
  "src/local_ai_hub/source_slice.py",
  "src/local_ai_hub/token_accounting.py",
]

[tool.ruff]
target-version = "8.2.0"
line-length = 120

[tool.ruff.lint]
select = [
  "F",    # pyflakes (syntax, unused vars, undefined names)
  "E4",   # import errors
  "E7",   # multiple statements / syntax
  "E9",   # runtime syntax errors
  "W",    # pycodestyle warnings
]
ignore = [
  "E501", # line length
  "E402", # module level import not at top of file (script sys.path guards)
  "E701", # multiple statements on one line (colon)
  "E702", # multiple statements on one line (semicolon)
  "E731", # do not assign a lambda expression, use a def
  "E741", # ambiguous variable name
  "W291", # trailing whitespace
  "W293", # blank line contains whitespace
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "F841"]
